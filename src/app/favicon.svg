<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="shine" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#FEF3C7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Coin body -->
  <circle cx="50" cy="50" r="47" fill="url(#coin)"/>
  <!-- Outer rim -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="#B45309" stroke-width="2.5"/>
  <!-- Inner rim -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#B45309" stroke-width="1.5" opacity="0.4"/>
  <!-- Shine -->
  <circle cx="50" cy="50" r="47" fill="url(#shine)"/>
  <!-- ¥ symbol -->
  <text x="50" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#92400E" text-anchor="middle">¥</text>
</svg>
